# Reference only. The VPS installer delegates generation to Maia Edge.
# Include inside the Nginx http context. Replace 10.77.0.2 with the host VPN IP.
server {
    listen 443 ssl;
    server_name learn.maiaplatform.org;
    ssl_certificate /etc/letsencrypt/live/learn.maiaplatform.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.maiaplatform.org/privkey.pem;
    location / {
        proxy_pass http://10.77.0.2:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
