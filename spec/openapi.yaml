      security: *id002
      responses:
        '200':
          description: Current status
        '403':
          description: Not owner/admin
        '409':
          description: Incompatible state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /admin/videos/{id}/cancel:
    parameters:
      - *id003
    post:
      summary: Cancel incomplete upload and remove its persisted chunks
      security: *id002
      responses:
        '200':
          description: Current status
        '403':
          description: Not owner/admin
        '409':
          description: Incompatible state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /lessons/{id}/video:
    parameters:
      - *id003
    get:
      summary: Stream authorized lesson video
      responses: &id004
        '200':
          description: MP4 or JPEG; Cache-Control private, no-store
        '206':
          description: Single byte range
        '403':
          description: No published preview, ownership or active enrollment for revision
        '404':
          description: Media not READY or absent
        '416':
          description: Unsatisfiable/unsupported Range
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          description: One bytes=start-end or suffix range
    head:
      summary: Same authorization and headers as GET, without body
      responses: *id004
  /lessons/{id}/poster:
    parameters:
      - *id003
    get:
      summary: Stream authorized lesson poster
      responses: &id005
        '200':
          description: MP4 or JPEG; Cache-Control private, no-store
        '206':
          description: Single byte range
        '403':
          description: No published preview, ownership or active enrollment for revision
        '404':
          description: Media not READY or absent
        '416':
          description: Unsatisfiable/unsupported Range
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          description: One bytes=start-end or suffix range
    head:
      summary: Same authorization and headers as GET, without body
      responses: *id005
  /admin/files:
    get:
      summary: List files in course (author owns files or admin)
      security: &id006
        - cookieAuth: []
      responses:
        '200':
          description: Array with id, course_id, filename, size, offset, status, duration
            and error
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
    post:
      summary: Reserve private upload (author/admin)
      security: *id006
      responses:
        '201':
          description: id, offset=0, chunkSize=524288
        '403':
          description: Course access denied
        '422':
          description: Invalid metadata or VIDEO_QUOTA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - filename
                - size
              properties:
                courseId:
                  type: string
                  format: uuid
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 'Allowed extensions: PNG/JPEG, PDF, ZIP or supported UTF-8 text/source
                    formats. Images: 10 MiB, 16 megapixels, 8192 pixels per side; normalized by the worker. Source/text: 2 MiB at validation.'
                size:
                  type: integer
                  minimum: 1
                  maximum: 134217728
