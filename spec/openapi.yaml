      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Download a READY material with course/revision/lesson authorization
      description: Course-level materials require OPEN_FREE publication or active
        enrollment/ownership; lesson materials also honor public preview. Always application/octet-stream
        with Content-Disposition attachment, nosniff and private no-store. Metadata
        includes title, description, filename and byte size.
      responses:
        '200':
          description: Streamed file
        '403':
          description: Enrollment/ownership required
        '404':
          description: Missing or not ready
    head:
      summary: Same authorization and headers as download, without a body
      responses:
        '200':
          description: File headers
        '403':
          description: Access denied
        '404':
          description: Not found
  /lessons/{id}/hls/master.m3u8:
    parameters:
      - $ref: '#/components/parameters/lessonId'
    get:
      summary: Authorized HLS master playlist for a READY lesson video
      description: Access follows the lesson's preview/enrollment/revision policy; public preview may be anonymous. The playlist contains relative links to variants.
      responses:
        '200':
          description: Private no-store HLS master playlist
          content:
            application/vnd.apple.mpegurl:
              schema: {type: string}
        '403': {description: Enrollment required or wrong revision}
        '404': {description: Video or HLS output not available}
  /lessons/{id}/hls/{variant}/index.m3u8:
