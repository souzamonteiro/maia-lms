openapi: 3.1.0
info:
  title: Maia Learn API — implemented MVP
  version: 0.1.0
  description: Implemented API endpoints for course delivery, MP4/HLS playback, assessments, commerce, certificates, privacy self-service, and operations. Production qualification is tracked separately; future endpoints remain in planned-openapi.yaml. Mutations require application/json except the authenticated octet-stream chunk route.
servers:
  - url: https://learn.maiaplatform.org/api/v1
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Create a learner and queue verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                locale:
                  type: string
                  default: pt-BR
                  description: Saved account locale. The browser sends its selected interface locale. Account emails support en, pt-BR and es, with English fallback for other accepted locales.
      responses:
        '201':
          description: Account created
        '409':
          description: AUTH_EMAIL_EXISTS
        '422':
          description: Invalid fields
  /auth/login:
    post:
      summary: Rotate session and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: User and session cookie
        '401':
          description: AUTH_INVALID_CREDENTIALS
  /auth/logout:
    post:
      summary: Destroy current session
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      summary: Current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Session missing or invalid
  /auth/profile:
    put:
      summary: Update the authenticated user's private display name
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200': {description: Display name saved}
        '401': {description: Authentication required}
        '422': {description: Empty or overlong display name}
  /auth/instructor-profile:
    get:
      summary: Get the authenticated author's public profile settings
      security:
        - cookieAuth: []
      responses:
        '200': {description: Saved profile settings, or null when not configured}
        '403': {description: Author or administrator role required}
    put:
      summary: Save and optionally publish the authenticated author's profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, displayName, isPublic]
              properties:
                slug: {type: string, minLength: 3, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
                displayName: {type: string, minLength: 1, maxLength: 100}
                bio: {type: string, maxLength: 5000}
                websiteUrl: {type: string, format: uri, description: HTTPS URLs only}
                isPublic: {type: boolean}
      responses:
        '200': {description: Saved profile settings}
        '403': {description: Author or administrator role required}
        '409': {description: INSTRUCTOR_PROFILE_SLUG_TAKEN}
        '422': {description: INSTRUCTOR_PROFILE_INVALID}
  /instructors/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Get an opted-in public instructor profile and published courses
      responses:
        '200': {description: Public profile fields and published courses; no account email or user ID}
        '404': {description: Instructor profile not found or not public}
  /auth/locale:
    put:
      summary: Update the authenticated user's interface language
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  enum: [en, pt-BR, es]
      responses:
        '200': {description: Persisted locale}
        '401': {description: Authentication required}
        '422': {description: Unsupported locale}
  /auth/change-password:
    post:
      summary: Change the authenticated user's password
      description: Requires the current password, rejects reusing it, atomically updates the password and session version, invalidates pending reset tokens, and destroys the current session. Sign in again after success.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, minLength: 1, maxLength: 128}
                newPassword: {type: string, minLength: 8, maxLength: 128}
      responses:
        '204': {description: Password changed; current session destroyed}
        '401': {description: Authentication required or current password invalid}
        '409': {description: Password changed concurrently}
        '422': {description: Invalid password length or unchanged password}
  /auth/resend-verification:
    post:
      summary: Resend an email verification link without account enumeration
      description: Always returns 204 for missing, unknown, already verified, or pending accounts. Existing unused verification tokens are invalidated; a new token and email use the saved account locale. Subject to the authentication rate limit.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        '204': {description: Accepted without disclosing account state}
        '429': {description: Authentication request limit reached}
  /auth/verify-email:
    get:
      summary: Consume a verification token from a legacy email link
      deprecated: true
      description: Kept for previously queued or delivered email links. New emails link to the confirmation page at /auth/verify-email, which uses POST only after the user confirms.
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Verified; code EMAIL_VERIFIED}
        '400': {description: AUTH_TOKEN_INVALID, AUTH_TOKEN_USED or AUTH_TOKEN_EXPIRED}
    post:
      summary: Explicitly confirm email ownership using a single-use verification token
      description: No session required. Token validation, consumption and user verification share one immediate transaction. Password-reset tokens cannot verify an email address. Existing verified_at timestamps are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Verified; code EMAIL_VERIFIED}
        '400': {description: AUTH_TOKEN_INVALID, AUTH_TOKEN_USED or AUTH_TOKEN_EXPIRED}
        '429': {description: Authentication request limit reached}
  /auth/forgot-password:
    post:
      summary: Queue reset email in the saved account locale if the account exists
      description: Request locale is ignored. Known, unknown and missing addresses receive 204; the response does not reveal the account language or existence.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Accepted without disclosing account existence
  /auth/reset-password:
    post:
      summary: Consume reset token and invalidate existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid token
  /courses:
    get:
      summary: Search and paginate published course revisions
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
          description: Literal title/summary search; percent and underscore are not wildcards.
        - name: locale
          in: query
          schema: {type: string, enum: [en, pt-BR, es]}
        - name: level
          in: query
          schema: {type: string, enum: [beginner, intermediate, advanced]}
        - name: category
          in: query
          description: Category slug, combined with the other filters using AND. Unknown slugs return no courses.
          schema: {type: string, minLength: 3, maxLength: 100, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
        - name: accessMode
          in: query
          schema: {type: string, enum: [OPEN_FREE, ENROLLED_FREE]}
        - name: sort
          in: query
          schema: {type: string, enum: [newest, title], default: newest}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: format
          in: query
          schema: {type: string, enum: [array, page], default: array}
      responses:
        '200':
          description: Legacy array by default. With format=page, an object containing items, total, page and pageSize. Total and items use the same database snapshot. Filters combine with AND; empty results have total=0 and items=[]. Sorting has a stable ID tie-breaker. Out-of-range pages have empty items.
        '422':
          description: Invalid pagination, filter, sort or search value
  /categories:
    get:
      summary: List the public flat taxonomy sorted by name
      responses:
        '200':
          description: Array of id, slug, name and description; all categories are public, including unused categories. Names are authored text shared across interface languages.
  /admin/users:
    get:
      summary: Search and paginate user accounts (administrator only)
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: role
          in: query
          schema: {type: string, enum: [learner, author, admin, worker]}
        - name: status
          in: query
          schema: {type: string, enum: [active, suspended]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Paginated accounts with email, display name, role, status, locale, verification date, and creation date; credentials and password hashes are never returned.
        '403': {description: Administrator required}
        '422': {description: Invalid search, filter, or pagination value}
  /admin/users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: Suspend or reactivate an account (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, suspended]}
      responses:
        '200': {description: Updated account id, role, and status; changes invalidate existing sessions and are audited}
        '403': {description: Administrator required}
        '404': {description: ADMIN_USER_NOT_FOUND}
        '409': {description: ADMIN_SELF_SUSPEND or ADMIN_LAST_ACTIVE; setting the current status is idempotent}
        '422': {description: Invalid account id or status}
  /admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: Change a user role (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [learner, author, admin]}
      responses:
        '200': {description: Updated account role; changes invalidate existing sessions and are audited}
        '403': {description: Administrator required}
        '404': {description: ADMIN_USER_NOT_FOUND}
        '409': {description: ADMIN_SELF_ROLE_CHANGE or ADMIN_LAST_ACTIVE; setting the current role is idempotent}
        '422': {description: Invalid account id or role; worker cannot be assigned administratively}
  /admin/enrollments:
    get:
      summary: Search and paginate enrollments with progress and access state (administrator only)
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: state
          in: query
          schema: {type: string, enum: [active, revoked]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: Enrollment summaries with learner/course, progress, state, and current entitlement status}
        '403': {description: Administrator required}
        '422': {description: Invalid search, state, or pagination value}
  /admin/enrollments/grant:
    post:
      summary: Grant access to a published course (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, courseSlug, reason]
              properties:
                email: {type: string, format: email}
                courseSlug: {type: string}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '201': {description: Active enrollment; existing enrollment/progress history is retained}
        '403': {description: Administrator required}
        '404': {description: ADMIN_GRANT_USER_NOT_FOUND or ADMIN_GRANT_COURSE_NOT_FOUND}
        '409': {description: ADMIN_GRANT_ALREADY_ACTIVE}
        '422': {description: Invalid email, course address, or reason}
  /admin/enrollments/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: Revoke enrollment access without deleting enrollment or progress (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '200': {description: Enrollment state; repeated revocation is idempotent and does not duplicate audit events}
        '403': {description: Administrator required}
        '404': {description: ADMIN_ENROLLMENT_NOT_FOUND}
        '422': {description: Invalid enrollment id or reason}
  /admin/enrollments/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Read append-only access grant/revocation history (administrator only)
      security:
        - cookieAuth: []
      responses:
        '200': {description: Chronologically ordered enrollment audit events, including actor and reason metadata}
        '403': {description: Administrator required}
        '404': {description: ADMIN_ENROLLMENT_NOT_FOUND}
  /admin/categories:
    get:
      summary: List categories with version and references_count (administrator only)
      security:
        - cookieAuth: []
      responses:
        '200': {description: Category array; references_count includes all historical revisions}
        '403': {description: Administrator required}
    post:
      summary: Create a category (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201': {description: Created category with id and version}
        '409': {description: CATEGORY_SLUG_EXISTS}
        '422': {description: Invalid category fields}
        '403': {description: Administrator required}
  /admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Update global category text and slug immediately (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CategoryInput'
                - $ref: '#/components/schemas/CategoryVersion'
      responses:
        '200': {description: Updated category with incremented version}
        '404': {description: CATEGORY_NOT_FOUND}
        '409': {description: CATEGORY_CONFLICT or CATEGORY_SLUG_EXISTS}
        '422': {description: Invalid fields}
        '403': {description: Administrator required}
    delete:
      summary: Delete a category without references in any course revision (administrator only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryVersion'
      responses:
        '204': {description: Deleted}
        '404': {description: CATEGORY_NOT_FOUND}
        '409': {description: CATEGORY_CONFLICT or CATEGORY_IN_USE}
        '422': {description: Invalid expectedVersion}
        '403': {description: Administrator required}
  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/courseId'
    get:
      summary: Course and syllabus; enrolled learners see their assigned revision
      responses:
        '200':
          description: Course with modules
          lesson metadata and optional enrollment: null
        '404':
          description: Missing or inaccessible draft
  /courses/{id}/enroll:
    parameters:
      - $ref: '#/components/parameters/courseId'
    post:
      summary: Idempotent free enrollment
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Existing or new enrollment
        '403':
          description: Paid course or revoked access
        '409':
          description: Course not published
  /me/enrollments:
    get:
      summary: My enrollments with progress, revision completion state, and a continuation lesson
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Enrollment array includes continue_lesson_id/title, completed_at (monotonic recorded completion), and completion_ready (current entitlement and required lessons/quizzes satisfy the shared policy) for the assigned revision
  /certificates/verify/{code}:
    get:
      summary: Publicly verify a certificate code
      description: Anonymous, rate-limited lookup of an issued certificate. Returns only the learner name, course title, declared workload, issuer, issue time, and current valid/revoked status. Invalid and unknown codes share the same not-found response; revoked reasons and internal identifiers are never returned.
      parameters:
        - in: path
          name: code
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Minimal public certificate disclosure
          headers:
            X-Robots-Tag:
              schema: {type: string}
              description: Always noindex, nofollow, noarchive
            Cache-Control:
              schema: {type: string}
              description: Always no-store so revocation status remains current
        '404': {description: CERTIFICATE_NOT_FOUND for malformed, unknown, or legacy certificates without a snapshot}
        '429': {description: RATE_LIMITED}
  /me/certificates/eligibility:
    post:
      summary: Check certificate eligibility for the authenticated learner's enrollment
      description: Read-only preflight. Requires active non-withdrawn access, server-recorded revision completion, verified email, a confirmed name, explicit disclosure consent, publisher-declared workload, and a revision instructor. Returns the public disclosure fields and hash to bind consent to the reviewed snapshot.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId, confirmedName, disclosureConsent]
              properties:
                enrollmentId: {type: string, format: uuid}
                confirmedName: {type: string, minLength: 1, maxLength: 200}
                disclosureConsent: {type: boolean, const: true}
      responses:
        '200': {description: Eligibility result, disclosure preview/hash, and unmet reason codes; no certificate is issued}
        '401': {description: Authentication required}
        '404': {description: CERTIFICATE_ENROLLMENT_NOT_FOUND}
        '422': {description: CERTIFICATE_INPUT_REQUIRED}
  /me/certificates:
    post:
      summary: Issue or idempotently return a certificate for an eligible enrollment
      description: The caller must submit the hash from the latest eligibility preview with explicit consent. Issuance rechecks policy and atomically stores one immutable payload snapshot, audit event, and certificate.generate job. Returns an existing active certificate on retries. The worker generates a private PDF/QR artifact asynchronously; public verification is provided separately.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId, confirmedName, disclosureConsent, acceptedDisclosureHash]
              properties:
                enrollmentId: {type: string, format: uuid}
                confirmedName: {type: string, minLength: 1, maxLength: 200}
                disclosureConsent: {type: boolean, const: true}
                acceptedDisclosureHash: {type: string, pattern: '^[a-f0-9A-F]{64}$'}
      responses:
        '201': {description: New certificate record and immutable payload snapshot with pdfStatus PENDING}
        '200': {description: Existing certificate returned idempotently with current pdfStatus}
        '401': {description: Authentication required}
        '404': {description: CERTIFICATE_ENROLLMENT_NOT_FOUND}
        '409': {description: CERTIFICATE_NOT_ELIGIBLE or CERTIFICATE_DISCLOSURE_CHANGED}
        '422': {description: CERTIFICATE_INPUT_REQUIRED}
    get:
      summary: List certificates belonging to the authenticated learner
      description: Returns learner-owned certificates with public verification paths and private download paths only for ready PDFs.
      security:
        - cookieAuth: []
      responses:
        '200': {description: Learner-owned certificate list with current validity and PDF states}
        '401': {description: Authentication required}
  /me/certificates/{id}/pdf:
    get:
      summary: Download an issued certificate PDF
      description: Authenticated certificate owner (or administrator) only. PDF artifacts are generated asynchronously by the worker and remain private in storage.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private PDF attachment
          content:
            application/pdf: {schema: {type: string, format: binary}}
        '401': {description: Authentication required}
        '404': {description: CERTIFICATE_NOT_FOUND}
        '409': {description: CERTIFICATE_PDF_NOT_READY}
  /admin/certificates:
    get:
      summary: Search certificates for administrator lifecycle support
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 100}
        - in: query
          name: status
          schema: {type: string, enum: [valid, revoked]}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: Paginated certificate records, private reasons, PDF state, and lineage}
        '403': {description: Administrator role required}
  /admin/certificates/{id}/revoke:
    patch:
      summary: Revoke an active certificate with a private reason
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '200': {description: Revoked status; repeating revocation is idempotent}
        '403': {description: Administrator role required}
        '404': {description: ADMIN_CERTIFICATE_NOT_FOUND}
  /admin/certificates/{id}/reissue:
    post:
      summary: Reissue a revoked certificate once
      description: Preserves its public snapshot, creates a fresh opaque code and PDF job, records the immutable supersedes link, and writes actor-attributed audit events. The predecessor remains verifiable as revoked.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '201': {description: Replacement certificate and supersedes ID}
        '403': {description: Administrator role required}
        '404': {description: ADMIN_CERTIFICATE_NOT_FOUND}
        '409': {description: ADMIN_CERTIFICATE_MUST_BE_REVOKED, ADMIN_CERTIFICATE_ALREADY_SUPERSEDED, ADMIN_CERTIFICATE_ACTIVE_EXISTS, or ADMIN_CERTIFICATE_SNAPSHOT_REQUIRED}
  /admin/certificates/{id}/history:
    get:
      summary: View a certificate enrollment's lineage and lifecycle audit events
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Certificate records, predecessor/successor links, and actor-attributed events with private reasons}
        '403': {description: Administrator role required}
        '404': {description: ADMIN_CERTIFICATE_NOT_FOUND}
  /lessons/{id}:
    parameters:
      - $ref: '#/components/parameters/lessonId'
    get:
      summary: Authorized lesson body and saved progress
      responses:
        '200':
          description: Lesson with original body, content_format, render_policy_version, sanitized body_html,
            saved progress, and an access-filtered navigation outline with previous/next
            lesson identifiers; captions include language, label, and plain transcript.
            The admin course detail includes captions_json for editing.
        '403':
          description: Enrollment required or wrong revision
  /lessons/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/lessonId'
    put:
      summary: Save position or mark lesson complete
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                positionSeconds:
                  type: integer
                  minimum: 0
                complete:
                  type: boolean
      responses:
        '200':
          description: Saved progress; completion is not undone by false
        '403':
          description: No active entitlement or cross-course/revision lesson
  /admin/courses:
    get:
      summary: List owned courses (admin sees all)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Course array
        '403':
          description: Author/admin required
    post:
      summary: Create a free-course draft with modules and lessons
      security:
        - cookieAuth: []
      requestBody:
        $ref: '#/components/requestBodies/course'
      responses:
        '201':
          description: Draft created
        '409':
          description: Slug exists or CREATION_EXISTS
        '422':
          description: Invalid course
  /admin/courses/{id}:
    parameters:
      - $ref: '#/components/parameters/courseId'
    put:
      summary: Create a new draft revision (owner or admin)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
                - title
                - summary
                - accessMode
                - modules
                - expectedRevisionId
              properties:
                categoryIds:
                  $ref: '#/components/schemas/CategoryIds'
                trailerVideoId:
                  type: [string, 'null']
                  format: uuid
                  default: null
                  description: Same-course video selected as public trailer after publication; READY required at publication.
                instructorName:
                  type: string
                  maxLength: 200
                  default: ''
                instructorBio:
                  type: string
                  maxLength: 5000
                  default: ''
                accessTerms:
                  type: string
                  maxLength: 5000
                  default: ''
                  description: Presentation text only; does not change enrollment rules.
                certificateTerms:
                  type: string
                  maxLength: 5000
                  default: ''
                  description: Presentation text only; does not enable certificate issuance.
                learningOutcomes:
                  type: string
                  maxLength: 5000
                  default: ''
                prerequisites:
                  type: string
                  maxLength: 5000
                  default: ''
                level:
                  type: [string, 'null']
                  enum: [beginner, intermediate, advanced, null]
                  default: null
                durationMinutes:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 60000
                  default: null
                  description: Author-provided estimated workload, not measured video duration.
                coverFileId:
                  type: [string, 'null']
                  format: uuid
                  default: null
                  description: PNG/JPEG attachment upload from this course. Publication requires READY.
                coverAlt:
                  type: string
                  maxLength: 300
                  default: ''
                  description: Required nonblank alternative text when publishing a cover.
                slug:
                  type: string
                  minLength: 3
                  maxLength: 100
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                title:
                  type: string
                  minLength: 3
                  maxLength: 255
                summary:
                  type: string
                  minLength: 10
                  maxLength: 1000
                locale:
                  type: string
                  default: pt-BR
                  enum:
                    - en
                    - pt-BR
                    - es
                accessMode:
                  type: string
                  enum:
                    - OPEN_FREE
                    - ENROLLED_FREE
                modules: &id007
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - title
                      - lessons
                    properties:
                      title:
                        type: string
                        minLength: 1
                        maxLength: 200
                      lessons:
                        type: array
                        minItems: 1
                        maxItems: 100
                        items:
                          type: object
                          required:
                            - title
                            - body
                          properties:
                            title:
                              type: string
                              minLength: 1
                              maxLength: 200
                            body:
                              type: string
                              minLength: 0
                              maxLength: 100000
                            required:
                              type: boolean
                              default: true
                            preview:
                              type: boolean
                              default: false
                            contentFormat:
                              type: string
                              enum:
                                - plain
                                - markdown
                              default: plain
                            videoId:
                              type:
                                - string
                                - 'null'
                              format: uuid
                              description: Video in the same course. Only READY video
                                can be published; drafts may have empty body.
                            attachments:
                              type: array
                              maxItems: 30
                              default: []
                              items:
                                $ref: '#/components/schemas/AttachmentInput'
                            captions:
                              type: array
                              maxItems: 3
                              default: []
                              description: At most one track per supported language.
                                Replaces tracks in the new revision.
                              items:
                                $ref: '#/components/schemas/CaptionInput'
                creationId:
                  type: string
                  format: uuid
                  description: Optional stable client ID to detect repeated draft
                    creation (409 CREATION_EXISTS).
                expectedRevisionId:
                  type: string
                  format: uuid
                attachments:
                  type: array
                  maxItems: 30
                  default: []
                  items:
                    $ref: '#/components/schemas/AttachmentInput'
      responses:
        '200':
          description: New draft revision; publication and enrolled revisions unchanged
        '403':
          description: Not owner/admin
        '409':
          description: 'DRAFT_CONFLICT: reload before retrying'
    get:
      summary: Read editable revision including lesson bodies (owner or admin)
      security: &id001
        - cookieAuth: []
      responses:
        '200':
          description: Editable course snapshot, revision_id and current_revision_id
        '403':
          description: Not owner/admin
    patch:
      summary: Save changed editing units atomically as a new draft revision
      description: Indexes refer to the exact expected revision. Course metadata, module titles and complete lesson values can be replaced. Structural additions/removals use PUT. Omitted units are read from the server; publication and enrollment snapshots remain unchanged.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevisionId, changes]
              properties:
                expectedRevisionId:
                  type: string
                  format: uuid
                changes:
                  type: array
                  minItems: 1
                  maxItems: 10101
                  items:
                    oneOf:
                      - type: object
                        required: [unit, value]
                        properties:
                          unit: {const: course}
                          value:
                            type: object
                            required: [slug, title, summary, accessMode]
                            description: Same metadata and attachment fields and limits as PUT, excluding modules and creationId. Includes categoryIds, coverFileId, coverAlt, learningOutcomes, prerequisites, level, durationMinutes, instructorName, instructorBio, accessTerms certificateTerms and trailerVideoId.
                      - type: object
                        required: [unit, module, title]
                        properties:
                          unit: {const: module}
                          module: {type: integer, minimum: 0, maximum: 99}
                          title: {type: string, minLength: 1, maxLength: 200}
                      - type: object
                        required: [unit, module, lesson, value]
                        properties:
                          unit: {const: lesson}
                          module: {type: integer, minimum: 0, maximum: 99}
                          lesson: {type: integer, minimum: 0, maximum: 99}
                          value:
                            type: object
                            required: [title, body]
                            description: Complete lesson using the same fields, defaults and limits as PUT, including videoId, captions and attachments. Omitted optional fields receive their normal defaults.
      responses:
        '200':
          description: Course metadata with the new current_revision_id
        '401':
          description: Authentication required
        '403':
          description: Owner or administrator required
        '404':
          description: Course not found
        '409':
          description: DRAFT_CONFLICT or SLUG_EXISTS; no changes applied
        '422':
          description: Invalid or duplicate editing unit, index, content or media relationship; no changes applied
  /courses/{id}/trailer:
    get:
      summary: Play the selected revision's course trailer
      description: Current published trailers are public regardless of enrollment mode. Drafts require owner/admin access; historical revisions also allow active enrolled learners. Supports HEAD, byte ranges and private no-store caching. Does not record progress.
      parameters:
        - $ref: '#/components/parameters/courseId'
        - name: revisionId
          in: query
          schema: {type: string, format: uuid}
          description: Defaults to the published revision.
      responses:
        '200':
          description: MP4 stream
        '206':
          description: MP4 byte range
        '403':
          description: Revision access denied
        '404':
          description: Trailer missing or not READY
        '416':
          description: Unsatisfiable range
  /courses/{id}/trailer/poster:
    get:
      summary: Trailer poster with the same revision authorization as playback
      parameters:
        - $ref: '#/components/parameters/courseId'
        - name: revisionId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: JPEG poster (HEAD and Range also supported)
        '403':
          description: Revision access denied
        '404':
          description: Trailer or poster unavailable
  /courses/{id}/cover:
    get:
      summary: Stream a normalized course cover for an authorized revision
      description: Current published covers are public. Drafts require owner/admin access; older revisions also allow actively entitled learners. Private no-store caching and nosniff headers apply. HEAD is supported.
      parameters:
        - $ref: '#/components/parameters/courseId'
        - name: revisionId
          in: query
          schema: {type: string, format: uuid}
          description: Defaults to the published revision.
      responses:
        '200':
          description: Normalized PNG or JPEG image
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '404':
          description: Missing, unready or inaccessible cover
  /admin/courses/{id}/publication-check:
    get:
      summary: Check publication readiness of the exact current draft (owner/admin)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/courseId'
        - name: revisionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private no-store result. Publication repeats validation inside its transaction.
          content:
            application/json:
              schema:
                type: object
                required: [revisionId, ready, issues]
                properties:
                  revisionId: {type: string, format: uuid}
                  ready: {type: boolean}
                  issues:
                    type: array
                    items:
                      type: object
                      required: [code]
                      properties:
                        code:
                          type: string
                          enum: [TRAILER_INVALID, COVER_INVALID, PUBLICATION_EMPTY, PUBLICATION_CONTENT, PUBLICATION_ORDER, VIDEO_INVALID, VIDEO_NOT_READY, FILE_INVALID, FILE_NOT_READY, QUIZ_EMPTY, QUIZ_INVALID]
                        moduleTitle: {type: string}
                        lessonTitle: {type: string}
                        attachmentTitle: {type: string}
        '401':
          description: Authentication required
        '403':
          description: Course owner or administrator required
        '404':
          description: Course not found
        '409':
          description: DRAFT_CONFLICT; requested revision is no longer current
        '422':
          description: Invalid revision identifier
  /admin/courses/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/courseId'
    post:
      summary: Publish current revision (admin only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Published
        '403':
          description: Admin required
        '409':
          description: Stale expected revision, slug conflict, or COURSE_WITHDRAWN
        '422':
          description: Publication blocked; issues contains the same structured checklist as publication-check. No publication changes are committed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRevisionId:
                  type: string
                  format: uuid
                  description: Recommended concurrency guard; optional for legacy
                    clients
  /admin/courses/{id}/review:
    parameters:
      - $ref: '#/components/parameters/courseId'
    post:
      summary: Submit an owned, ready draft for administrator review
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevisionId]
              properties:
                expectedRevisionId: {type: string, format: uuid}
      responses:
        '200': {description: Course moved to REVIEW; repeated submission is idempotent}
        '403': {description: Course owner or administrator required}
        '409': {description: DRAFT_CONFLICT or COURSE_REVIEW_STATE_INVALID}
        '422': {description: Publication checklist failed}
  /admin/courses/{id}/quiz:
    parameters:
      - $ref: '#/components/parameters/courseId'
    get:
      summary: List quiz definitions for the current unpublished course revision
      security:
        - cookieAuth: []
      parameters:
        - name: revisionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current revision quiz definitions including correct answer keys for authoring}
        '403': {description: Course owner or administrator required}
        '404': {description: COURSE_NOT_FOUND}
        '409': {description: QUIZ_DRAFT_REQUIRED}
    put:
      summary: Create or replace a quiz in the current owned unpublished revision (author/admin)
      description: Quiz definitions are revision-bound and can only be changed before attempts exist. Correct answer keys are returned only by this administrative endpoint.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevisionId, questions]
              properties:
                expectedRevisionId: {type: string, format: uuid}
                lessonId: {type: [string, 'null'], format: uuid}
                passPercent: {type: integer, minimum: 1, maximum: 100, default: 70}
                maxAttempts: {type: integer, minimum: 1, maximum: 100, default: 3}
                randomizeQuestions: {type: boolean, default: false}
                timeLimitSeconds: {type: [integer, 'null'], minimum: 1, maximum: 86400}
                questions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [prompt, choices, correctChoiceKeys]
                    properties:
                      prompt: {type: string, minLength: 1, maxLength: 5000}
                      explanation: {type: string, maxLength: 5000, description: Optional rationale revealed only after attempt submission}
                      choices:
                        type: array
                        minItems: 2
                        maxItems: 10
                        items:
                          type: object
                          required: [key, text]
                          properties:
                            key: {type: string, minLength: 1, maxLength: 20}
                            text: {type: string, minLength: 1, maxLength: 500}
                      correctChoiceKeys: {type: array, minItems: 1, maxItems: 10, items: {type: string}}
                      points: {type: integer, minimum: 1, maximum: 1000, default: 1}
      responses:
        '200': {description: Saved quiz definition, including answer keys for authoring}
        '403': {description: Course owner or administrator required}
        '404': {description: COURSE_NOT_FOUND}
        '409': {description: QUIZ_DRAFT_REQUIRED, QUIZ_HAS_ATTEMPTS, or COURSE_WITHDRAWN}
        '422': {description: Invalid quiz definition or QUIZ_LESSON_REVISION_MISMATCH}
  /admin/quizzes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Read a quiz in the current unpublished revision for its author or an administrator
      security:
        - cookieAuth: []
      responses:
        '200': {description: Quiz definition with answer keys}
        '403': {description: Course owner or administrator required}
        '404': {description: QUIZ_NOT_FOUND}
        '409': {description: QUIZ_DRAFT_REQUIRED}
  /quizzes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Read a published quiz for an actively enrolled learner
      description: Returns prompts and choices without correct answer keys. Response is private/no-store.
      security:
        - cookieAuth: []
      responses:
        '200': {description: Learner-safe quiz definition without correct_choice_keys}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_NOT_FOUND}
  /quizzes/{id}/attempts:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Start or resume the learner's open attempt for an enrolled quiz
      description: The write is atomic. Concurrent or repeated start requests resume the same open attempt; submitted attempts consume the configured attempt limit.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Existing open attempt resumed}
        '201': {description: New attempt started with server-selected order, deadline, and no answer keys}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_NOT_FOUND}
        '409': {description: QUIZ_ATTEMPTS_EXHAUSTED}
  /quizzes/{id}/results:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: List the authenticated learner's submitted results and expired attempts for an enrolled quiz
      description: Private/no-store history includes submitted score, possible points, pass status, timestamps, and post-submit feedback. Expired unsubmitted attempts are marked expired without score or answer feedback. Active open attempts are omitted.
      security:
        - cookieAuth: []
      responses:
        '200': {description: Submitted results and expired attempt history for this learner and enrollment revision; active open attempts and their answers are omitted}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_NOT_FOUND}
  /attempts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Read an owned attempt's current or submitted state
      security:
        - cookieAuth: []
      responses:
        '200': {description: Private attempt state and learner-safe questions/selections; never includes correct-choice keys}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_ATTEMPT_NOT_FOUND}
  /attempts/{id}/answers:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Save partial answers for an owned open attempt without grading
      description: Saves selections for recovery after reload. Score and awarded points remain unset until final submission; duplicate question IDs, foreign questions, invalid choices, submitted attempts, and expired deadlines are rejected.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [questionId, selectedKeys]
                    properties:
                      questionId: {type: string, format: uuid}
                      selectedKeys: {type: array, maxItems: 10, items: {type: string}}
      responses:
        '200': {description: Private attempt state with saved selections; no answer keys or scoring is exposed}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_ATTEMPT_NOT_FOUND}
        '409': {description: QUIZ_ATTEMPT_SUBMITTED or QUIZ_DEADLINE_EXPIRED}
        '422': {description: QUIZ_QUESTION_INVALID, QUIZ_DUPLICATE_ANSWER, or QUIZ_CHOICE_INVALID}
  /attempts/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Atomically grade and submit an attempt
      description: The server validates question and choice membership, computes points/pass status, and freezes submitted rows. Repeated submission returns the stored result without regrading.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [questionId, selectedKeys]
                    properties:
                      questionId: {type: string, format: uuid}
                      selectedKeys: {type: array, maxItems: 10, items: {type: string}}
      responses:
        '200': {description: Stored score in points, pass flag, submitted time, already_submitted indicator, and post-submission answer feedback with correctness and explanations}
        '403': {description: Active enrollment required}
        '404': {description: QUIZ_ATTEMPT_NOT_FOUND}
        '409': {description: QUIZ_DEADLINE_EXPIRED}
        '422': {description: QUIZ_QUESTION_INVALID, QUIZ_DUPLICATE_ANSWER, or QUIZ_CHOICE_INVALID}
  /admin/courses/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/courseId'
    post:
      summary: Archive, keeping enrolled access (admin only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Archived
        '403':
          description: Admin required
  /admin/courses/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/courseId'
    post:
      summary: Urgently withdraw a published course and revoke learner/media access
      description: Requires a reason of 5 to 1000 characters. This is distinct from archiving, preserves enrollments/progress, and is irreversible through this API.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        '200': {description: Withdrawal timestamp and reason; repeated requests are idempotent}
        '403': {description: Administrator required}
        '409': {description: COURSE_WITHDRAWAL_STATE_INVALID}
        '422': {description: Invalid or missing withdrawal reason}
  /admin/courses/{id}/preview:
    get:
      summary: Author-only saved draft simulation for learner or visitor access
      description: Requires course ownership or administrator role. Never publishes, enrolls, or tracks progress. Visitor mode omits restricted lesson content. Media retains normal author authorization.
      security: *id001
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: audience
          in: query
          required: true
          schema: {type: string, enum: [learner, visitor]}
        - name: revisionId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private no-store snapshot with title, summary, revision_id, audience, course attachments and ordered modules/lessons. Locked lessons contain only id, title and locked. Accessible lessons include body_html, video_id, attachments and captions with language, label and transcript.
        '401':
          description: Sign-in required
        '403':
          description: Course owner or administrator required
        '404':
          description: Course not found
        '409':
          description: DRAFT_CONFLICT; requested revision is no longer current
        '422':
          description: Invalid audience or revision identifier
  /admin/content/preview:
    post:
      summary: Render content using the same sanitization as lesson delivery (author/admin)
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
                - contentFormat
              properties:
                body:
                  type: string
                  maxLength: 100000
                contentFormat:
                  type: string
                  enum:
                    - plain
                    - markdown
      responses:
        '200':
          description: Sanitized HTML using the current server-selected rendering policy, also used for newly saved lessons. Clients cannot select the policy.
          content:
            application/json:
              schema:
                type: object
                required: [html, renderPolicyVersion]
                properties:
                  html:
                    type: string
                  renderPolicyVersion:
                    type: integer
                    enum: [1]
        '403':
          description: Author/admin required
        '422':
          description: Invalid content
  /home:
    get:
      summary: Active editorial selections; published courses only, ordered by ascending
