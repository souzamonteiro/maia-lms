                - expectedVersion
                - items
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
                items:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/HomePlacement'
      responses:
        '200':
          description: Updated version and items
        '403':
          description: Admin required
        '409':
          description: HOME_CONFLICT
        '422':
          description: Invalid input, HOME_DUPLICATE or HOME_UNPUBLISHED
  /admin/videos:
    get:
      summary: List videos in course (author owns videos or admin)
      security: &id002
        - cookieAuth: []
      responses:
        '200':
          description: Array with id, course_id, filename, size, offset, status, duration
            and error
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
    post:
      summary: Reserve private upload (author/admin)
      security: *id002
      responses:
        '201':
          description: id, offset=0, chunkSize=524288
        '403':
          description: Course access denied
        '422':
          description: Invalid metadata or VIDEO_QUOTA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - filename
                - size
              properties:
                courseId:
                  type: string
                  format: uuid
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                size:
                  type: integer
                  minimum: 1
                  maximum: 2147483648
  /admin/videos/{id}:
    parameters:
      - &id003
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get owned upload and resumable chunk SHA-256 manifest
      security: *id002
      responses:
        '200':
          description: Metadata and chunks (offset, size, sha256); storage keys omitted
        '403':
          description: Not owner/admin
        '404':
          description: Not found
  /admin/videos/{id}/chunks:
    parameters:
      - *id003
    put:
      summary: Append chunk at confirmed offset (author/admin)
      security: *id002
      responses:
        '200':
          description: New offset
        '409':
          description: UPLOAD_CONFLICT; reload upload metadata before retrying
        '413':
          description: Chunk exceeds 512 KiB
        '422':
          description: Empty chunk or exceeds reserved size
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
