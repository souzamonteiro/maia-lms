        '404':
          description: Missing video or language track
  /auth/privacy/export:
    get:
      summary: Download the authenticated account's data export
      description: Returns user-scoped profile, learning, assessment, entitlement, payment, certificate/consent, media metadata, and privacy-request records. Excludes password hashes, sessions, email-token hashes, provider references, and storage keys. No account deletion is performed.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private, no-store JSON export
          headers:
            Cache-Control:
              schema: {type: string, example: 'private, no-store'}
            Content-Disposition:
              schema: {type: string, example: 'attachment; filename="maia-account-export.json"'}
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, generatedAt, account]
                properties:
                  schemaVersion: {type: string, const: maia-account-export-v1}
                  generatedAt: {type: string, format: date-time}
                  account: {type: object, description: Own account fields only; no credential hashes}
                  instructorProfile: {type: [object, 'null']}
                  enrollments: {type: array, items: {type: object}}
                  entitlements: {type: array, items: {type: object}}
                  lessonProgress: {type: array, items: {type: object}}
                  quizAttempts: {type: array, items: {type: object}}
                  quizAnswers: {type: array, items: {type: object}}
                  orders: {type: array, items: {type: object}}
                  refunds: {type: array, items: {type: object}}
                  certificates: {type: array, items: {type: object}}
                  mediaUploads: {type: array, items: {type: object}}
                  privacyRequests: {type: array, items: {type: object}}
        '401': {description: Authentication required}
        '429': {description: PRIVACY_RATE_LIMITED}
  /auth/privacy/requests:
    get:
      summary: List the authenticated user's privacy requests
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Own requests, newest first, private no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, request_type, status, created_at, updated_at]
                  properties:
                    id: {type: string, format: uuid}
                    request_type: {type: string, const: deletion}
                    status: {type: string, enum: [OPEN, IN_REVIEW, CLOSED]}
                    created_at: {type: string}
                    updated_at: {type: string}
        '401': {description: Authentication required}
        '429': {description: PRIVACY_RATE_LIMITED}
    post:
      summary: Record an idempotent deletion request without deleting the account
      description: Repeated OPEN/IN_REVIEW deletion requests return the existing request. Retention, legal review, and execution are not configured by this endpoint.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestType]
              properties:
                requestType: {type: string, const: deletion}
      responses:
        '201': {description: New request recorded with status OPEN}
        '200': {description: Existing open request returned}
        '401': {description: Authentication required}
        '422': {description: PRIVACY_REQUEST_INVALID}
        '429': {description: PRIVACY_RATE_LIMITED}
  /admin/operations:
    get:
      summary: Read aggregated worker, queue, storage, payment, and playback status
      description: Administrator-only summary. Playback counts cover seven UTC dates and group by resource type and HTTP status class; no paths, course/user IDs, IPs, or payloads are stored. Does not report latency, buffering, or watch time.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Private, no-store operational summary
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, workers, media, outbox, payments, storage, playback, alerts]
                properties:
                  generatedAt: {type: string, format: date-time}
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        status: {type: string, enum: [healthy, stale, stopped]}
                        startedAt: {type: string}
                        lastSeenAt: {type: string}
                        stoppedAt: {type: [string, 'null']}
                  media: {type: object}
                  outbox: {type: object}
                  payments: {type: object, additionalProperties: {type: integer}}
                  storage: {type: [object, 'null']}
                  playback:
                    type: object
                    properties:
                      windowDays: {type: integer, const: 7}
                      requests: {type: integer}
                      byResource: {type: object, additionalProperties: {type: integer}}
                      byStatusClass: {type: object, additionalProperties: {type: integer}}
                      responseDuration:
                        type: object
                        description: Time from playback middleware entry until response finish, not time to first byte, client download completion, or buffering. Historical requests without timing are excluded from the average.
                        required: [measuredRequests, averageMs]
                        properties:
                          measuredRequests: {type: integer, minimum: 0}
                          averageMs: {type: [number, 'null'], minimum: 0}
                  alerts:
                    type: array
                    items:
                      type: string
                      enum: [WORKER_MISSING, WORKER_NOT_HEALTHY, MEDIA_JOB_STUCK, MEDIA_JOB_FAILED, OUTBOX_EXHAUSTED, STORAGE_LOW]
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: Production HTTPS cookie; local HTTP development uses sid.
  parameters:
    courseId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Course UUID or slug
    lessonId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    course:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - slug
              - title
              - summary
              - accessMode
              - modules
            properties:
              slug:
                type: string
                minLength: 3
                maxLength: 100
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              title:
                type: string
                minLength: 3
                maxLength: 255
              summary:
                type: string
                minLength: 10
                maxLength: 1000
              locale:
                type: string
                default: pt-BR
                enum:
                  - en
                  - pt-BR
                  - es
              accessMode:
                type: string
                enum:
                  - OPEN_FREE
                  - ENROLLED_FREE
              modules: *id007
              categoryIds:
                $ref: '#/components/schemas/CategoryIds'
              creationId:
                type: string
                format: uuid
                description: Optional stable client ID to detect repeated draft creation
                  (409 CREATION_EXISTS).
              attachments:
                type: array
                maxItems: 30
                default: []
                items:
                  $ref: '#/components/schemas/AttachmentInput'
  schemas:
    CategoryIds:
      type: array
      maxItems: 10
      uniqueItems: true
      default: []
      items: {type: string, format: uuid}
      description: Existing category IDs assigned to this revision. Unknown IDs return CATEGORY_NOT_FOUND. Assignments become public on publication; omitted assignments default to empty in full course writes.
    CategoryInput:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string, minLength: 3, maxLength: 100, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 1000, default: ''}
    CategoryVersion:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
    HomePlacement:
      type: object
      required:
        - courseId
        - slot
        - priority
        - startsAt
        - endsAt
      properties:
        courseId:
          type: string
          format: uuid
        slot:
          type: string
          enum:
            - hero
            - featured
            - recommended
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        startsAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - 'null'
          format: date-time
    AttachmentInput:
      type: object
      required:
        - fileId
        - title
      properties:
        fileId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ''
    CaptionInput:
      type: object
      required:
        - language
        - label
        - vtt
      properties:
        language:
          type: string
          enum:
            - en
            - pt-BR
            - es
        label:
          type: string
          minLength: 1
          maxLength: 80
        vtt:
          type: string
          maxLength: 100000
          description: Plain WebVTT cues only; at most 100000 UTF-8 bytes. Increasing
            start times, end greater than start, no markup/CSS/regions/cue settings.
