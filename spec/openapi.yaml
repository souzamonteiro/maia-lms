      responses:
        '200':
          description: Object with hero, featured, recommended arrays of public course
            metadata. Start inclusive, end exclusive.
  /admin/home:
    get:
      summary: Read editorial selection and concurrency version (admin only)
      security: *id001
      responses:
        '200':
          description: Object with version integer and items (HomePlacement array)
        '403':
          description: Admin required
    put:
      summary: Replace editorial selection atomically (admin only)
      description: At most one hero and one placement per course/slot. End must follow
